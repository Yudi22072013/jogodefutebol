<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumo ao Topo — Carreira no Futebol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050c09;--card:#0d1c15;--card2:#12261d;--line:#1d3529;--line2:#2a4a3a;--txt:#e8f2ed;--mut:#8ba89a;--acc:#34d399;--acc2:#10b981;--gold:#f5c542;--blue:#60a5fa;--red:#f87171;--pur:#c084fc;--amb:#fbbf24;--teal:#2dd4bf}
*{box-sizing:border-box;margin:0;padding:0}
html{scrollbar-color:#2a4a3a #0b1611}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1100px 600px at 50% -10%,#123a29 0%,var(--bg) 62%) fixed,var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.teko{font-family:Teko,sans-serif;letter-spacing:.5px}
.mut{color:var(--mut)}.sm{font-size:12px}.xs{font-size:11px}.b{font-weight:700}
.acc{color:var(--acc)}.gold{color:var(--gold)}.blue{color:var(--blue)}.red{color:var(--red)}.amb{color:var(--amb)}.pur{color:var(--pur)}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px 48px}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.card h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13px;background:linear-gradient(135deg,#10b981,#0d9488);color:#fff;box-shadow:0 4px 14px rgba(16,185,129,.25);transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.ghost{background:#132a20;border:1px solid var(--line2);box-shadow:none;color:var(--txt)}
.btn.gold{background:linear-gradient(135deg,#f5c542,#d99a0b);color:#1d1400}
.btn.blue{background:linear-gradient(135deg,#3b82f6,#6366f1)}
.btn.danger{background:#3a1515;border:1px solid #6b2424;color:#fca5a5;box-shadow:none}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:grayscale(.6)}
.chip{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;background:#10221a;border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.on{background:var(--acc2);color:#04140d;border-color:var(--acc)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#132a20;border:1px solid var(--line2)}
.bar{height:8px;border-radius:99px;background:#0a1510;border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s}
/* header */
#hdr{position:sticky;top:0;z-index:30;background:rgba(5,12,9,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin:0 -14px 18px;padding:12px 14px 0}
.hdr-top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.ovr-bubble{position:relative;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:Teko;font-size:30px;font-weight:700;color:#04140d;background:linear-gradient(135deg,var(--acc),#0ea5e9)}
.ovr-bubble span{position:absolute;bottom:-6px;right:-8px;font-family:Inter;font-size:10px;font-weight:800;background:#04140d;color:var(--acc);padding:2px 6px;border-radius:6px;border:1px solid var(--acc2)}
.hdr-name{font-weight:800;font-size:16px}
.hdr-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:#a7f3d0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#0b1812;border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:96px}
.pill .lbl{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:3px}
.pill b{font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 13px;border-radius:11px;font-weight:700;font-size:13px;color:var(--mut);white-space:nowrap;border:1px solid transparent}
.tab:hover{color:var(--txt);background:#0f2018}
.tab.on{background:#123a29;color:#fff;border-color:#1f5a3f}
.tab .cnt{background:var(--amb);color:#1d1400;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:4px}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:700;text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #12251c}
td.c,th.c{text-align:center}
tr.me td{background:rgba(52,211,153,.1);color:#d1fae5;font-weight:700}
tr.up td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
tr.down td:first-child{box-shadow:inset 3px 0 0 var(--red)}
tr.lead td:first-child{box-shadow:inset 3px 0 0 var(--gold)}
.tscroll{overflow-x:auto}
.clubcell{display:flex;align-items:center;gap:8px;white-space:nowrap}
.crest{flex:none;display:block}
/* dashboard */
.dash{display:grid;grid-template-columns:290px 1fr;gap:16px}
@media(max-width:900px){.dash{grid-template-columns:1fr}}
.fut-wrap{filter:drop-shadow(0 14px 28px rgba(0,0,0,.5))}
.fut{position:relative;max-width:270px;margin:0 auto;aspect-ratio:3/4.45;padding:22px 20px 0;background:linear-gradient(160deg,var(--f1),var(--f2));color:var(--ft);clip-path:polygon(0 7%,12% 0,88% 0,100% 7%,100% 86%,50% 100%,0 86%);overflow:hidden}
.fut:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);transform:translateX(-100%);animation:shine 5s infinite}
@keyframes shine{0%,70%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.fut-top{display:flex;justify-content:space-between}
.fut-ovr{font-family:Teko;font-size:58px;line-height:.8;font-weight:700}
.fut-pos{font-family:Teko;font-size:24px;line-height:1;font-weight:600}
.fut-sil{position:absolute;right:14px;top:30px;width:58%;opacity:.9}
.fut-name{position:relative;margin-top:96px;text-align:center;font-family:Teko;font-size:26px;font-weight:700;text-transform:uppercase;border-bottom:1px solid currentColor;border-color:rgba(0,0,0,.2);padding-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fut-stats{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;padding:8px 14px 0;font-family:Teko;font-size:19px;line-height:1.08}
.fut-stats span b{font-weight:700;margin-right:6px}
.next-match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.vs{font-family:Teko;font-size:30px;color:var(--amb)}
.kpi{background:#0b1812;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-family:Teko;font-size:32px;line-height:1}
.kpi span{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.news li{list-style:none;display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #12251c;font-size:13px}
.news li:last-child{border:0}
/* match */
.scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;background:linear-gradient(180deg,#0f3020,#08160f);position:relative;overflow:hidden}
.scoreboard:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 40px,transparent 40px 80px);pointer-events:none}
.sb-name{font-family:Teko;font-size:26px;font-weight:700;line-height:1;margin-top:6px}
.sb-score{display:flex;align-items:center;gap:10px;background:#030806;border:1px solid #1f5a3f;border-radius:14px;padding:4px 18px;font-family:Teko;font-size:54px;font-weight:700;line-height:1.1}
.sb-score i{font-style:normal;color:var(--acc);font-size:36px}
.sb-min{display:inline-block;margin-top:8px;font-weight:800;font-size:13px;background:#0b1812;border:1px solid var(--line2);padding:3px 12px;border-radius:99px}
.sb-comp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--acc);margin-bottom:6px}
.match-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:16px;margin-top:16px}
@media(max-width:900px){.match-grid{grid-template-columns:1fr}}
.pitch-box{position:relative;border-radius:14px;overflow:hidden;border:1px solid #1f5a3f}
#pitch{display:block;width:100%;height:auto}
.pd,.bl{transition:transform .8s cubic-bezier(.4,.1,.2,1)}
.fast .pd,.fast .bl{transition-duration:.3s}
.goalflash{position:absolute;inset:0;display:grid;place-items:center;font-family:Teko;font-size:72px;font-weight:700;color:#fff;text-shadow:0 0 30px rgba(52,211,153,.9);background:radial-gradient(circle,rgba(16,185,129,.35),transparent 70%);animation:gf 1.4s forwards;pointer-events:none}
.goalflash.opp{text-shadow:0 0 30px rgba(248,113,113,.9);background:radial-gradient(circle,rgba(248,113,113,.3),transparent 70%);font-size:48px}
@keyframes gf{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.05)}75%{opacity:1}100%{opacity:0;transform:scale(1.1)}}
.decision{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(3,10,7,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.dec-box{background:linear-gradient(180deg,#123a29,#0b1f16);border:1px solid var(--acc2);border-radius:16px;padding:16px;max-width:440px;width:100%;text-align:center;box-shadow:0 0 40px rgba(16,185,129,.25);animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.dec-box h4{font-size:17px;margin-bottom:4px}
.dec-opts{display:grid;gap:8px;margin-top:12px}
.dec-opt{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;background:#0b1812;border:1px solid var(--line2);text-align:left;transition:border-color .15s,transform .1s}
.dec-opt:hover{border-color:var(--acc);transform:translateY(-1px)}
.dec-opt small{display:block;color:var(--mut);font-size:11px}
.pct{font-family:Teko;font-size:24px;font-weight:700;min-width:50px;text-align:right}
.momentum{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:12px;font-weight:700}
.mbar{flex:1;height:8px;border-radius:99px;background:#7f1d1d;overflow:hidden}
.mbar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#34d399);transition:width .6s}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mstats div{background:#0b1812;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.mstats b{display:block;font-family:Teko;font-size:26px;line-height:1}
.mstats span{font-size:10px;text-transform:uppercase;color:var(--mut)}
.rating-big{font-family:Teko;font-size:44px;font-weight:700;line-height:1}
.mlog{height:330px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;font-size:13px;padding-right:4px}
.mlog p{padding:7px 10px;border-radius:10px;background:#0b1812;border-left:3px solid #234;animation:pop .2s}
.mlog p b{color:var(--acc);margin-right:6px;font-family:Teko;font-size:16px}
.mlog .g{border-color:var(--acc)}.mlog .gg{border-color:var(--gold);background:#2a2208}.mlog .r{border-color:var(--red)}.mlog .y{border-color:var(--amb)}.mlog .b{border-color:var(--blue)}.mlog .a{border-color:var(--pur)}
/* market */
.mk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.club-card{background:#0b1812;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.club-card:hover{border-color:var(--line2);transform:translateY(-2px)}
.club-card:before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.offer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(245,197,66,.08),transparent);border:1px solid #5b4a14;border-radius:16px;padding:14px}
.search{flex:1;min-width:180px;background:#0b1812;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;outline:none}
.search:focus{border-color:var(--acc)}
select.search{flex:none;min-width:0}
/* training */
.tr-card{background:#0b1812;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:5px}.dots i{width:12px;height:12px;border-radius:50%;background:#1d3529;border:1px solid var(--line2)}.dots i.on{background:var(--amb);border-color:var(--amb);box-shadow:0 0 8px rgba(251,191,36,.6)}
/* shop */
.shop{background:#0b1812;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
.shop.own{border-color:#6d28d9;background:linear-gradient(180deg,rgba(124,58,237,.12),#0b1812)}
.shop .ico{font-size:32px}
/* trophies */
.trophy-shelf{background:linear-gradient(180deg,#1a1408,#0d0a04);border:1px solid #4a3a10;border-radius:18px;padding:18px}
.tro-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tro-cat{text-align:center;background:rgba(0,0,0,.25);border:1px solid #3a2e0c;border-radius:14px;padding:14px 8px;position:relative}
.tro-cat.locked svg{filter:grayscale(1) brightness(.35)}
.tro-cat.locked{opacity:.75}
.tro-cat .n{font-family:Teko;font-size:34px;line-height:1;color:var(--gold)}
.tro-cat .t{font-size:12px;font-weight:700}
.tro-cat .h{font-size:10.5px;color:var(--mut);margin-top:4px}
.tro-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tro-item{display:flex;gap:10px;align-items:center;background:#0b1812;border:1px solid #3a2e0c;border-radius:14px;padding:10px}
.tro-item svg{flex:none}
.glow{animation:glow 2.5s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 8px rgba(245,197,66,.7))}}
/* misc */
#toasts{position:fixed;right:14px;bottom:14px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}
.toast{background:#0f2a1e;border:1px solid var(--acc2);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:pop .25s;transition:opacity .3s}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
.modal-box{background:linear-gradient(180deg,#123a29,#0b1612);border:1px solid var(--acc2);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;animation:pop .25s}
.modal-box h3{font-size:20px;margin-bottom:12px}
.modal-body{font-size:14px;line-height:1.6;color:#d1e7dc}
.modal-body p{margin-bottom:8px}
.modal-act{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.create{max-width:720px;margin:20px auto}
.hero{text-align:center;margin-bottom:22px}
.hero h1{font-family:Teko;font-size:64px;line-height:.9;text-transform:uppercase;background:linear-gradient(90deg,#fff,#a7f3d0,#f5c542);-webkit-background-clip:text;background-clip:text;color:transparent}
label.lbl{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:6px}
.field{width:100%;background:#08130e;border:1px solid var(--line2);border-radius:12px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--acc)}
.pick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:640px){.pick{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pick label{cursor:pointer}
.pick input{display:none}
.pick .opt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:#08130e;border:1px solid var(--line2);text-align:center;font-size:12px;font-weight:700;transition:all .15s}
.pick input:checked+.opt{border-color:var(--acc);background:#0f3324;box-shadow:0 0 0 2px rgba(52,211,153,.25)}
.chart{width:100%;height:auto;display:block}
.empty{padding:30px;text-align:center;color:var(--mut)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <div id="hdr" class="hidden"></div>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div id="toasts"></div>
<input type="file" id="importFile" accept=".json,application/json" class="hidden">

<script>
'use strict';
/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sig=x=>1/(1+Math.exp(-x));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const poisson=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;};
const wpick=(items,wf)=>{let t=0;for(const i of items)t+=wf(i);let r=Math.random()*t;for(const i of items){r-=wf(i);if(r<=0)return i;}return items[items.length-1];};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'R$ '+Math.round(n).toLocaleString('pt-BR');
const fmtS=n=>n>=1e6?'R$ '+(n/1e6).toFixed(n>=1e8?0:1).replace('.',',')+' mi':n>=1e4?'R$ '+Math.round(n/1e3)+' mil':fmt(n);

/* ============ DATA ============ */
const DIVS={
  SERIE_D:{name:'Série D',short:'D',wage:500,color:'#94a3b8'},
  SERIE_C:{name:'Série C',short:'C',wage:2000,color:'#d4915a'},
  SERIE_B:{name:'Série B',short:'B',wage:7000,color:'#cbd5e1'},
  SERIE_A:{name:'Série A',short:'A',wage:45000,color:'#f5c542'},
  EUROPE:{name:'Elite Europeia',short:'EU',wage:220000,color:'#a78bfa'}
};
const DIV_KEYS=Object.keys(DIVS);
const BR_LADDER=['SERIE_D','SERIE_C','SERIE_B','SERIE_A'];
const ROUNDS=18;

const CLUB_LIST=[
 // id, name, short, c1, c2, div, ovr, country
 ['sousa','Sousa-PB','SOU','#b91c1c','#ffffff','SERIE_D',55,'BR'],['retro','Retrô FC','RET','#1e3a8a','#facc15','SERIE_D',57,'BR'],

function recalc(){const w=POSITIONS[G.p.pos].w;let s=0;for(const k in w)s+=w[k]*G.p.stats[k];G.p.ovr=Math.round(s);}
function genName(cc,used){const [f,l]=NAMES[cc]||NAMES.BR;let n,t=0;do{n=pick(f)+' '+pick(l);}while(used.has(n)&&t++<20);used.add(n);return n;}

function makeFixtures(ids){const t=shuffle([...ids]),n=t.length,rounds=[];for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];m.push((r+i)%2===0?[a,b]:[b,a]);}rounds.push(m);t.splice(1,0,t.pop());}return rounds.concat(rounds.map(rd=>rd.map(([a,b])=>[b,a])));}

function startSeason(){
  G.league={};
  for(const d of DIV_KEYS){const ids=clubsIn(d);G.league[d]={fx:makeFixtures(ids),tb:Object.fromEntries(ids.map(id=>[id,{j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0}])),last:[]};}
  for(const id in G.squads)G.squads[id].forEach(p=>{p.g=0;p.as=0;});
  G.round=1;G.season={games:0,goals:0,assists:0,rs:0,byDiv:{},clubs:[G.clubId]};G.declined=[];
}

function simScore(h,a){const oh=G.clubs[h].ovr,oa=G.clubs[a].ovr;return[Math.min(7,poisson(clamp(1.35*Math.exp((oh-oa)/14),.25,4))),Math.min(7,poisson(clamp(1.05*Math.exp((oa-oh)/14),.2,3.6)))];}
function creditGoals(club,n){const sq=G.squads[club];for(let i=0;i<n;i++){const s=wpick(sq,p=>p.w);s.g++;if(Math.random()<.72)wpick(sq.filter(p=>p!==s),p=>p.a).as++;}}
function applyResult(div,h,a,gh,ga){const tb=G.league[div].tb,H=tb[h],A=tb[a];H.j++;A.j++;H.gp+=gh;H.gc+=ga;A.gp+=ga;A.gc+=gh;
  if(gh>ga){H.v++;H.pts+=3;A.d++;}else if(gh<ga){A.v++;A.pts+=3;H.d++;}else{H.e++;A.e++;H.pts++;A.pts++;}}
function processRound(userRes){
  for(const d of DIV_KEYS){const L=G.league[d];L.last=[];
    for(const [h,a] of L.fx[G.round-1]){let gh,ga;
      if(userRes&&(h===G.clubId||a===G.clubId)){[gh,ga]=userRes.score;}
      else{[gh,ga]=simScore(h,a);creditGoals(h,gh);creditGoals(a,ga);}
      applyResult(d,h,a,gh,ga);L.last.push([h,a,gh,ga]);}}
}
function sortedTable(d){const tb=G.league[d].tb;return Object.entries(tb).map(([id,r])=>({id,...r,sg:r.gp-r.gc})).sort((x,y)=>y.pts-x.pts||y.v-x.v||y.sg-x.sg||y.gp-x.gp||G.clubs[y.id].ovr-G.clubs[x.id].ovr);}
function userFixture(){return G.league[userDiv()].fx[G.round-1].find(m=>m.includes(G.clubId));}
function scorers(d,key){
  const list=[];for(const id of clubsIn(d))for(const p of G.squads[id])list.push({n:p.n,club:id,v:p[key],pos:p.pos});
  const bd=G.season.byDiv[d];if(bd)list.push({n:G.p.name,club:bd.club,v:key==='g'?bd.g:bd.a,pos:G.p.pos,user:true});
  return list.sort((a,b)=>b.v-a.v||(b.user?1:0)-(a.user?1:0));
}
function wageFor(id){const c=G.clubs[id];const f=1+Math.max(0,G.p.ovr-c.ovr+8)*.07;return Math.round(DIVS[c.div].wage*f*(1+hype()/250)/50)*50;}
function interest(id){if(id===G.clubId)return 0;const c=G.clubs[id];let v=55+(G.p.ovr-c.ovr)*6+(hype()-30)*.35;if(owns('agent'))v+=12;
  if(c.div==='EUROPE'){if(owns('jet'))v+=6;if(G.p.ovr<80)v=Math.min(v,4);}return Math.round(clamp(v,0,97));}
function makeOffer(id){const w=Math.round(wageFor(id)*rnd(1,1.2)/50)*50;G.offers.push({club:id,wage:w,luvas:w*3,exp:3});}
function genOffers(){
  G.offers=G.offers.filter(o=>--o.exp>0);if(G.offers.length>=4)return;
  if(Math.random()>.22+hype()/300)return;
  const myO=G.clubs[G.clubId].ovr;
  const c=CLUB_LIST.filter(c=>c.id!==G.clubId&&!G.offers.some(o=>o.club===c.id)&&G.clubs[c.id].ovr>=myO-2&&interest(c.id)>=50);
  if(!c.length)return;const ch=wpick(c,x=>Math.pow(G.clubs[x.id].ovr,2)/100);makeOffer(ch.id);
  addNews('📨',`Proposta recebida do ${ch.name}!`);toast(`📨 Nova proposta do ${ch.name}!`);
}

function barChart(hist){

  const cw=(W-pl-pr)/hist.length,bw=Math.min(22,cw*.32);let s='';
  for(let i=0;i<=4;i++){const y=pt+(H-pt-pb)*(1-i/4);s+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="#1d3529"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="11" fill="#8ba89a">${step*i}</text>`;}

function lineChart(pts){

  const X=i=>pl+(W-pl-pr)*i/(pts.length-1),Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));let s='';

  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.o)}`).join('');

  const every=Math.ceil(pts.length/12);
  pts.forEach((p,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(p.o)}" r="4.5" fill="#0d1c15" stroke="#f5c542" stroke-width="2.5"><title>${p.y}: OVR ${p.o}</title></circle>`;if(i%every===0||i===pts.length-1)s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="#8ba89a">${p.y}</text><text x="${X(i)}" y="${Y(p.o)-10}" text-anchor="middle" font-size="11" font-weight="700" fill="#fde68a">${p.o}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5c542" stop-opacity=".35"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></linearGradient></defs>${s}</svg>`;

async function wikiLogo(id){
  const q=WIKI_Q[id];if(!q)return null;
  const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=3&gsrsearch='+encodeURIComponent(q)+'&prop=pageimages&piprop=thumbnail%7Cname&pithumbsize=160&pilicense=any';
  const j=await getJSON(u);const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index).filter(p=>p.thumbnail);
  // só aceita imagens com cara de escudo (evita fotos de estádio)
  const ok=pages.find(p=>/\.svg$|logo|crest|escudo|badge|emblem|shield|bras[aã]o/i.test(p.pageimage||''));
  return ok?ok.thumbnail.source:null;
}
async function tsdbLeague(league){
  const j=await getJSON('https://www.thesportsdb.com/api/v1/json/123/search_all_teams.php?l='+encodeURIComponent(league));

function tsdbMatch(id,teams){const c=CLUB[id],names=[norm(c.name),norm(WIKI_Q[id]||''),...(TSDB_ALT[id]||[]).map(norm)];
  const t=teams.find(t=>{const n=norm(t.strTeam||''),a=norm(t.strTeamAlternate||'');return names.some(x=>x&&(n===x||a===x||(x.length>4&&(n.includes(x)||x.includes(n)))));});
  const b=t&&(t.strBadge||t.strTeamBadge);return b?b+'/small':null;}
async function loadLogos(force){
  if(logoBusy||!logosOn)return;const now=Date.now(),WEEK=6048e5;
  if(force)LOGO={t:0,map:{},miss:{},src:{}};
  const todo=CLUB_LIST.map(c=>c.id).filter(id=>!LOGO.map[id]&&!(LOGO.miss[id]&&now-LOGO.miss[id]<WEEK));
  if(!todo.length)return;logoBusy=true;let found=0;
  // 1) Wikipedia — 4 requisições em paralelo
  const queue=[...todo];
  await Promise.all(Array.from({length:4},async()=>{while(queue.length){const id=queue.shift();try{const u=await wikiLogo(id);if(u){LOGO.map[id]=u;LOGO.src[id]='Wikipedia';found++;swapCrests(id);}}catch(e){}}}));
  // 2) TheSportsDB — uma requisição por liga, só para quem faltou (limite gratuito: 30/min)
  const left=todo.filter(id=>!LOGO.map[id]),byLeague={};
  left.forEach(id=>{const L=TSDB_LEAGUE(CLUB[id]);(byLeague[L]=byLeague[L]||[]).push(id);});
  for(const L of Object.keys(byLeague)){try{const teams=await tsdbLeague(L);byLeague[L].forEach(id=>{const u=tsdbMatch(id,teams);if(u){LOGO.map[id]=u;LOGO.src[id]='TheSportsDB';found++;swapCrests(id);}});}catch(e){}await new Promise(r=>setTimeout(r,2200));}
  todo.forEach(id=>{if(!LOGO.map[id])LOGO.miss[id]=now;});
  LOGO.t=now;saveLogos();logoBusy=false;
  const total=Object.keys(LOGO.map).length;
  if(found)toast(`🛡️ ${total}/${CLUB_LIST.length} escudos reais carregados`);
  else if(!total)toast('🛡️ Não foi possível baixar escudos agora — usando escudos desenhados.');
  if(tab==='career'&&G&&!(M&&M.started&&!M.done))render();
}

function flash(mine,txt){if(M.auto)return;const b=$('#pitchBox');if(!b)return;const f=document.createElement('div');f.className='goalflash'+(mine?'':' opp');f.textContent=txt;b.appendChild(f);setTimeout(()=>f.remove(),1400);}
function effStat(keys,b){const v=keys.reduce((s,k)=>s+G.p.stats[k],0)/keys.length;return v*(.82+.18*G.energy/100)+b;}
function prob(o){if(o.type==='foul')return 1;const q=G.clubs[M.opp].ovr,x=(effStat(o.k,o.b)-q)/7;
  const base=o.pen?[.5,.4]:{shot:[.1,.44],assist:[.15,.45],chain:[.25,.55],def:[.3,.6],steal:[.3,.55]}[o.type];return clamp(base[0]+base[1]*sig(x),.03,.97);}
function setTimer(){clearInterval(M.timer);M.timer=setInterval(tick,[900,450,170][M.speed-1]);}
function startMatch(){if(G.energy<15){modal('🥵 Atleta exausto','Você está com menos de 15% de energia. Descanse no Centro de Treinamento ou fique no banco nesta rodada.');return;}

  el.innerHTML=`<div class="dec-box"><h4>${s.t}</h4><p class="sm mut">${s.d}</p><div class="dec-opts">${s.o.map((o,i)=>{const p=Math.round(prob(o)*100);const c=p>=60?'#34d399':p>=35?'#fbbf24':'#f87171';

function resolve(i,auto){
  const sc=M.pending;if(!sc)return;const o=sc.o[i];M.pending=null;hideDecision();if(!auto)sfx.click();
  let p=prob(o);if(auto)p*=.85;const ok=Math.random()<p;
  switch(o.type){
   case 'shot':if(ok){userGoal(o.pen?'Cobrança perfeita!':o.lob?'Que cavadinha!':pick(['Que golaço!','Indefensável!','No ângulo!']));if(!o.pen&&sc.key!=='keeper'&&Math.random()<.5)wpick(G.squads[G.clubId],x=>x.a).as++;}
     else{M.shots++;M.rating-=.12;M.mom=clamp(M.mom+3,8,92);addLog(pick(['❌ O goleiro voa e faz a defesa!','❌ Pra fora, raspando a trave!','❌ Por cima do gol.','❌ Travado na hora H!'])+` <span class="mut">(${o.l})</span>`,'');}break;
   case 'assist':if(ok)teamGoal(true);else{M.rating-=.08;addLog(`⚠️ ${o.l}: a zaga corta a jogada.`,'');}break;
   case 'chain':if(ok){M.rating+=.25;addLog(`🔥 ${esc(G.p.name)} deixa o marcador no chão!`,'a');openScn('keeper');if(!auto)updateMatchUI();return;}
     M.rating-=.1;addLog('⚠️ Perdeu a bola na tentativa de drible.','');break;
   case 'def':if(ok){M.tackles++;M.rating+=.6;M.mom=clamp(M.mom+5,8,92);addLog(`🛡️ Corte perfeito de ${esc(G.p.name)}!`,'b');}
     else{M.rating-=.2;if(Math.random()<.45)oppGoal();else addLog('😮 O atacante passou, mas finalizou mal!','');}break;
   case 'steal':if(ok){M.tackles++;M.rating+=.4;addLog(`🔒 ${esc(G.p.name)} rouba a bola no campo de ataque!`,'b');if(Math.random()<.35){openScn('counter');if(!auto)updateMatchUI();return;}}
     else{M.rating-=.06;addLog('↩️ O adversário escapou da pressão.','');}break;
   case 'foul':M.tackles++;if(Math.random()<.3){M.yellow++;if(M.yellow>=2){M.sentOff=true;M.rating-=1.2;M.d-=4;addLog(`🟥 Segundo amarelo! ${esc(G.p.name)} está expulso!`,'r');}else{M.rating-=.25;addLog(`🟨 Falta tática. Amarelo para ${esc(G.p.name)}.`,'y');}}
     else addLog('✋ Falta tática para matar o contra-ataque.','');break;
  }
  if(!auto)updateMatchUI();
}
function autoResolve(){const s=M.pending;let best=0,bp=-1;s.o.forEach((o,i)=>{const p=o.type==='foul'?.5:prob(o);if(p>bp){bp=p;best=i;}});resolve(best,true);}
function simRest(){if(!M||M.done)return;clearInterval(M.timer);M.auto=true;hideDecision();let g=0;while(!M.done&&g++<200){if(M.pending)autoResolve();else tick();}M.auto=false;renderLog();renderControls();updateMatchUI();}
function endMatch(){clearInterval(M.timer);M.min=90;M.done=true;M.pending=null;hideDecision();
  const res=Math.sign(M.sMy-M.sOpp);if(M.sOpp===0&&!M.sentOff&&(G.p.pos==='ZAG'||G.p.pos==='VOL'))M.rating+=.6;M.rating=clamp(M.rating+res*.3,3,10);

function worldCup(){
  const nat=G.p.nat,N=NATIONS[nat],called=G.p.ovr>=74||(G.p.ovr>=71&&hype()>=65),T=N.s+(called?(G.p.ovr-80)*.35:0);
  const pool=shuffle(Object.keys(NATIONS).filter(n=>n!==nat));
  const lines=[`🌍 <b>Copa do Mundo ${G.year}</b> — ${called?`você foi <b>convocado</b> pela seleção ${N.f} ${nat}!`:`você não foi convocado (OVR ${G.p.ovr}; precisa de 74+).`}`];
  let goals=0,apps=0,won=false;
  const game=(opp,ko,stage)=>{const x=(T-NATIONS[opp].s)/4.2;let gf,ga,res;
    if(ko){const adv=Math.random()<sig(x);if(Math.random()<.22){gf=ga=ri(0,2);res=adv?'pw':'pl';}else if(adv){gf=ri(1,3);ga=ri(0,gf-1);res='w';}else{ga=ri(1,3);gf=ri(0,ga-1);res='l';}}
    else{const r=Math.random(),pw=sig(x)*.78;if(r<pw){gf=ri(1,3);ga=ri(0,gf-1);res='w';}else if(r<pw+.22){gf=ga=ri(0,2);res='d';}else{ga=ri(1,3);gf=ri(0,ga-1);res='l';}}
    let pg=0;if(called){apps++;const lam={ATA:.55,PON:.42,MEI:.32,VOL:.12,ZAG:.1}[G.p.pos]*Math.pow(G.p.ovr/80,2);pg=Math.min(gf,poisson(lam));goals+=pg;}
    lines.push(`<span class="sm">${stage}: ${N.f} ${gf} × ${ga} ${NATIONS[opp].f} ${opp}${res[0]==='p'?' (pên.)':''}${pg?` — ⚽×${pg} seu`:''}</span>`);return res;};
  let pts=0;for(let i=0;i<3;i++){const r=game(pool[i],false,'Grupo');pts+=r==='w'?3:r==='d'?1:0;}
  if(pts>=4||(pts===3&&Math.random()<.5)){const rest=pool.slice(3).sort((a,b)=>NATIONS[a].s-NATIONS[b].s);let alive=true;
    ['Oitavas','Quartas','Semifinal','Final'].forEach((st,i)=>{if(!alive)return;const idx=Math.min(rest.length-1,Math.floor(rest.length*i/4)+ri(0,2));const opp=rest.splice(idx,1)[0];const r=game(opp,true,st);
      if(r==='l'||r==='pl'){alive=false;lines.push(`❌ Eliminado ${st==='Final'?'na final':'nas '+st.toLowerCase()}.`);}});
    if(alive){won=true;lines.push(`🏆 <b>${nat.toUpperCase()} CAMPEÃ DO MUNDO!</b>`);}}
  else lines.push('❌ Eliminado na fase de grupos.');
  if(called){G.career.wcGoals+=goals;G.career.wcApps+=apps;}
  return{lines,won,called,goals:called?goals:0};
}
function endSeason(){
  const yr=G.year,div=userDiv(),s=G.season,avg=s.games?s.rs/s.games:0,tbl=sortedTable(div),pos=tbl.findIndex(r=>r.id===G.clubId)+1;
  const got=[],lines=[];const add=(t,l)=>{G.trophies.push({t,l,y:yr,c:G.clubId});got.push({t,l});};
  if(pos===1)add('league',`Campeão da ${DIVS[div].name}`);
  const sc=scorers(div,'g'),as=scorers(div,'as');
  if(sc[0].user&&sc[0].v>0)add('boot',`Artilheiro da ${DIVS[div].name} (${sc[0].v} gols)`);
  if(as[0].user&&as[0].v>0)add('assist',`Garçom da ${DIVS[div].name} (${as[0].v} assist.)`);
  if(s.games>=12&&avg>=7.6)add('star',`Craque da ${DIVS[div].name}`);

  DIV_KEYS.forEach(d=>{const ch=sortedTable(d)[0].id;G.clubs[ch].ovr=clamp(G.clubs[ch].ovr+1,45,93);if(d!==div)lines.push(`<span class="sm mut">🏆 ${DIVS[d].name}: ${CLUB[ch].name} campeão</span>`);});
  const moves=[];for(let i=0;i<3;i++){const lo=BR_LADDER[i],up=BR_LADDER[i+1];sortedTable(lo).slice(0,2).forEach(r=>moves.push([r.id,up,1]));sortedTable(up).slice(-2).forEach(r=>moves.push([r.id,lo,-1]));}
  moves.forEach(([id,d,dir])=>{G.clubs[id].div=d;G.clubs[id].ovr=clamp(G.clubs[id].ovr+dir*2,45,93);

  CLUB_LIST.forEach(c=>{const k=G.clubs[c.id];k.ovr=clamp(k.ovr+ri(-1,1),45,93);});
  let wc=null;if((yr-2026)%4===0){wc=worldCup();if(wc.won&&wc.called)add('wc',`Campeão da Copa do Mundo ${yr}`);if(wc.goals>=5)add('wcboot',`Chuteira de Ouro da Copa ${yr} (${wc.goals} gols)`);}
  if((div==='SERIE_A'||div==='EUROPE')&&s.games>=10){const score=G.p.ovr+s.goals*.6+s.assists*.4+avg*3+(pos===1?6:0)+(wc&&wc.won&&wc.called?10:0)+(div==='EUROPE'?5:0);if(score>=135)add('ballon',`Bola de Ouro ${yr}`);}
  G.history.push({y:yr,club:G.clubId,clubs:[...new Set(s.clubs)],div,pos,j:s.games,g:s.goals,a:s.assists,avg:+avg.toFixed(2),ovr:G.p.ovr});
  G.hype=clamp(G.hype+got.length*6,0,100);
  // envelhecimento e desenvolvimento
  const before=G.p.ovr;G.p.age++;const st=G.p.stats,slow=owns('physio')?.5:1;

  if(G.p.age>=31){st.pace-=rnd(.8,2)*slow;st.physical-=rnd(.5,1.5)*slow;}
  if(G.p.age>=34)for(const k in st)st[k]-=rnd(.4,1.4)*slow;

  recalc();G.year++;G.ovrHist.push({y:G.year,o:G.p.ovr});
  if(G.p.ovr!==before)lines.push(`${G.p.ovr>before?'📈':'📉'} Desenvolvimento de entressafra: OVR ${before} → ${G.p.ovr}.`);
  const fair=wageFor(G.clubId);if(fair*.9>G.wage){G.wage=Math.round(fair*.9/50)*50;lines.push(`✍️ Contrato renovado: novo salário ${fmt(G.wage)}/semana.`);}

  got.forEach(t=>addNews('🏆',`${t.l} (${yr})`));

  if(G.p.age>=38){retire(true);return;}
  modal(`🎆 Fim da temporada ${yr}`,`<p>O <b>${CLUB[G.clubId].name}</b> terminou em <b>${pos}º lugar</b> na ${DIVS[div].name}.</p>
   <p>Seus números: <b>${s.games}</b> jogos, <b class="acc">${s.goals}</b> gols, <b class="blue">${s.assists}</b> assistências, nota média <b>${avg.toFixed(2)}</b>.</p>
   ${got.length?`<div style="display:grid;gap:8px;margin:12px 0">${got.map(t=>`<div class="tro-item">${trophySVG(TROPHY_TYPES[t.t].ic,TROPHY_TYPES[t.t].col,40)}<b>${t.l}</b></div>`).join('')}</div>`:''}
   ${lines.map(l=>`<p>${l}</p>`).join('')}${wc?wc.lines.map(l=>`<p>${l}</p>`).join(''):''}
   <p class="sm mut">Agora você tem ${G.p.age} anos. Nova temporada: ${G.year}.</p>`);
}
function retire(forced){G.retired=true;save();tab='home';render();
  modal(forced?'👋 Hora de pendurar as chuteiras':'👋 Aposentadoria',`<p>Aos ${G.p.age} anos, ${esc(G.p.name)} encerra a carreira com <b>${G.career.goals}</b> gols, <b>${G.career.assists}</b> assistências e <b>${G.trophies.length}</b> troféus.</p>`);}

   <div class="row" style="justify-content:center;gap:10px;flex-wrap:wrap"><button class="btn gold" data-act="tab" data-tab="trophies">🥇 Ver galeria de troféus</button><button class="btn ghost" data-act="tab" data-tab="career">📈 Ver estatísticas</button><button class="btn" data-act="newcareer">✨ Nova carreira</button></div></div>`;}

/* ---------- TRAINING ---------- */
function gainFactor(k){const v=G.p.stats[k],a=G.p.age;let f=clamp((99-v)/45,.08,1.3)*(a<=20?1.3:a<=24?1.1:a<=28?.9:a<=31?.6:.35);if(v>=G.p.pot+4)f*=.35;if(owns('personal'))f*=1.4;return f;}
function viewTraining(){
  return `<div class="card"><div class="row between wrapf" style="margin-bottom:16px;gap:14px"><div><h2 style="font-size:22px">💪 Centro de Treinamento</h2><p class="sm mut">Cada treino usa 1 ação semanal e energia. Ganhos diminuem perto do seu potencial e com a idade.</p></div>
   <div class="row" style="gap:16px"><div><div class="xs mut">AÇÕES DA SEMANA</div><div class="dots" style="margin-top:6px">${Array.from({length:maxActions()},(_,i)=>`<i class="${i<G.actions?'on':''}"></i>`).join('')}</div></div>
   <button class="btn blue" data-act="rest" ${G.actions<1||G.energy>=100?'disabled':''}>😴 Descansar (+35 energia)</button></div></div>
   <div class="grid g3">${STATS.map(s=>{const v=G.p.stats[s.k],can=G.actions>0&&G.energy>=s.cost&&v<99,w=POSITIONS[G.p.pos].w[s.k];
    return `<div class="tr-card"><div class="row between"><div class="row"><span style="font-size:24px">${s.ic}</span><div><b>${s.n}</b><div class="xs mut">${s.d}</div></div></div><span class="teko" style="font-size:30px;color:${s.col}">${Math.round(v)}</span></div>
     <div class="bar"><i style="width:${v}%;background:${s.col}"></i></div>
     <div class="row between xs mut"><span>Ganho esperado: <b class="acc">+${(.77*gainFactor(s.k)).toFixed(1)}</b></span><span>Peso no OVR: ${Math.round(w*100)}%</span></div>
     <button class="btn sm wide" data-act="train" data-k="${s.k}" ${can?'':'disabled'}>Treinar (−${s.cost}% energia)</button></div>`;}).join('')}</div></div>`;
}
function train(k){const s=STATS.find(x=>x.k===k);if(G.actions<1||G.energy<s.cost)return;sfx.click();
  const before=G.p.ovr,g=(.8+Math.random()*1.2)*.55*gainFactor(k);G.p.stats[k]=Math.min(99,G.p.stats[k]+g);G.energy-=s.cost;G.actions--;recalc();save();
  toast(`${s.ic} ${s.n} +${g.toFixed(1)}${G.p.ovr>before?` · <b>OVR ${G.p.ovr}!</b>`:''}`);render();}
function rest(){if(G.actions<1)return;G.actions--;G.energy=clamp(G.energy+35,0,100);save();toast('😴 Dia de descanso: energia recuperada.');render();}

/* ---------- MARKET ---------- */
function viewMarket(){
  return `<div style="display:grid;gap:16px">
   <div class="card"><h3><span>📨 Propostas recebidas (${G.offers.length})</span><span class="badge">Negociações nesta semana: ${G.negs}/${maxNegs()}</span></h3>
    ${G.offers.length?`<div style="display:grid;gap:10px">${G.offers.map((o,i)=>`<div class="offer"><div class="row">${crest(o.club,44)}<div><b style="font-size:16px">${CLUB[o.club].name}</b><div class="row" style="gap:6px;margin-top:4px">${divBadge(G.clubs[o.club].div)}<span class="badge">OVR ${G.clubs[o.club].ovr}</span><span class="badge">⏳ expira em ${o.exp} rod.</span></div></div></div>
     <div class="sm"><div>Salário: <b class="acc">${fmt(o.wage)}/sem</b> <span class="mut">(atual ${fmt(G.wage)})</span></div><div>Luvas: <b class="gold">${fmt(o.luvas)}</b></div></div>
     <div class="row"><button class="btn sm" data-act="accept" data-i="${i}">✍️ Assinar</button><button class="btn ghost sm" data-act="reject" data-i="${i}">Recusar</button></div></div>`).join('')}</div>`
    :`<div class="empty">Nenhuma proposta na mesa. Jogue bem, ganhe visibilidade ou negocie diretamente com qualquer clube abaixo.</div>`}</div>
   <div class="card"><h3><span>🌍 Mercado completo — todos os ${CLUB_LIST.length} clubes</span></h3>
    <div class="row wrapf" style="gap:8px;margin-bottom:12px"><input class="search" id="mkSearch" placeholder="🔎 Buscar clube..." value="${esc(ui.mkSearch)}">
     <select class="search" id="mkSort"><option value="ovr" ${ui.mkSort==='ovr'?'selected':''}>Ordenar: OVR</option><option value="int" ${ui.mkSort==='int'?'selected':''}>Ordenar: Interesse</option><option value="wage" ${ui.mkSort==='wage'?'selected':''}>Ordenar: Salário</option></select></div>
    <div class="row wrapf" style="gap:6px;margin-bottom:14px">${['ALL',...DIV_KEYS].map(k=>`<button class="chip ${ui.mkDiv===k?'on':''}" data-act="mkdiv" data-d="${k}">${k==='ALL'?'Todas':DIVS[k].name}</button>`).join('')}</div>
    <div class="mk-grid" id="mkGrid"></div></div></div>`;
}
function renderMarketGrid(){const el=$('#mkGrid');if(!el)return;const q=ui.mkSearch.trim().toLowerCase();
  let list=CLUB_LIST.filter(c=>(ui.mkDiv==='ALL'||G.clubs[c.id].div===ui.mkDiv)&&(!q||c.name.toLowerCase().includes(q))).map(c=>({c,ovr:G.clubs[c.id].ovr,int:interest(c.id),wage:wageFor(c.id)}));
  list.sort((a,b)=>ui.mkSort==='int'?b.int-a.int:ui.mkSort==='wage'?b.wage-a.wage:b.ovr-a.ovr);
  el.innerHTML=list.map(({c,ovr,int,wage})=>{const mine=c.id===G.clubId,dec=G.declined.includes(c.id),off=G.offers.some(o=>o.club===c.id),ic=int>=65?'#34d399':int>=35?'#fbbf24':'#f87171';
    const btn=mine?'<button class="btn ghost sm wide" disabled>Seu clube atual</button>':off?'<button class="btn ghost sm wide" disabled>📨 Proposta na mesa</button>':dec?'<button class="btn ghost sm wide" disabled>Recusou nesta temporada</button>':`<button class="btn sm wide" data-act="nego" data-id="${c.id}" ${G.negs<1||int<1?'disabled':''}>🤝 Negociar</button>`;
    return `<div class="club-card" style="--c1:${c.c1};--c2:${c.c2}"><div class="row">${crest(c.id,40)}<div style="min-width:0"><b>${c.name}</b><div class="row" style="gap:6px;margin-top:4px">${divBadge(G.clubs[c.id].div)}<span class="badge">OVR ${ovr}</span></div></div></div>
     <div class="row between xs"><span class="mut">Interesse em você</span><b style="color:${ic}">${mine?'—':int+'%'}</b></div><div class="bar"><i style="width:${mine?0:int}%;background:${ic}"></i></div>
     <div class="row between xs"><span class="mut">Salário estimado</span><b class="acc">${fmtS(wage)}/sem</b></div>${btn}</div>`;}).join('')||'<div class="empty">Nenhum clube encontrado.</div>';}
function negotiate(id){if(G.negs<1)return;G.negs--;const p=interest(id);
  if(Math.random()*100<p){makeOffer(id);sfx.coin();toast(`✅ O ${CLUB[id].name} enviou uma proposta!`);addNews('🤝',`Negociação avançou: proposta do ${CLUB[id].name}.`);}
  else{G.declined.push(id);toast(`❌ O ${CLUB[id].name} não se interessou por agora.`);}
  save();render();}
function acceptOffer(i){const o=G.offers[i];if(!o)return;const from=G.clubId;G.clubId=o.club;G.wage=o.wage;G.money+=o.luvas;G.career.earnings+=o.luvas;G.offers=[];G.season.clubs.push(o.club);G.hype=clamp(G.hype+4,0,100);M=null;
  addNews('✍️',`Transferência: ${CLUB[from].name} → ${CLUB[o.club].name}.`);save();sfx.cheer();tab='home';render();
  modal('✍️ Contrato assinado!',`<div class="row" style="justify-content:center;gap:14px;margin:6px 0 14px">${crest(from,44)}<span style="font-size:24px">➜</span>${crest(o.club,56)}</div><p>Bem-vindo ao <b>${CLUB[o.club].name}</b> (${DIVS[G.clubs[o.club].div].name})!</p><p>Salário: <b>${fmt(o.wage)}/semana</b> · Luvas: <b>${fmt(o.luvas)}</b></p>`);}

/* ---------- LIFESTYLE ---------- */
function viewLife(){return `<div class="card"><div class="row between wrapf" style="margin-bottom:16px"><div><h2 style="font-size:22px">🏰 Estilo de Vida</h2><p class="sm mut">Invista o salário em estrutura, imagem e carreira. Tudo tem efeito real no jogo.</p></div><div style="text-align:right"><div class="xs mut">SALDO</div><div class="teko acc" style="font-size:34px">${fmt(G.money)}</div></div></div>
  <div class="grid g3">${SHOP.map(it=>{const own=owns(it.id),can=G.money>=it.c;return `<div class="shop ${own?'own':''}"><div class="row between"><span class="ico">${it.ic}</span>${own?'<span class="badge pur">✔ Adquirido</span>':''}</div><b>${it.n}</b><span class="sm mut">${it.d}</span><b class="${can||own?'acc':'red'}">${fmt(it.c)}</b>
   ${own?'<button class="btn ghost sm wide" disabled>Já é seu</button>':`<button class="btn sm wide" data-act="buy" data-id="${it.id}" ${can?'':'disabled'}>Comprar</button>`}</div>`;}).join('')}</div></div>`;}
function buy(id){const it=SHOP.find(x=>x.id===id);if(!it||owns(id)||G.money<it.c)return;G.money-=it.c;G.owned.push(id);
  if(id==='boots'){G.p.stats.shooting=Math.min(99,G.p.stats.shooting+1.5);G.p.stats.dribbling=Math.min(99,G.p.stats.dribbling+1.5);recalc();}
  if(id==='mansion')G.actions++;if(id==='agent')G.negs++;
  addNews(it.ic,`Comprou: ${it.n}.`);sfx.coin();save();toast(`${it.ic} ${it.n} adquirido!`);render();}

/* ---------- CAREER ---------- */
function viewCareer(){const c=G.career,h=G.history,pts=[...G.ovrHist];if(pts[pts.length-1].o!==G.p.ovr||pts[pts.length-1].y!==G.year)pts.push({y:G.year,o:G.p.ovr});
  const tm=G.season.games;
  return `<div style="display:grid;gap:16px">
   <div class="card" style="background:linear-gradient(120deg,#2a2208,#0d1c15 50%,#0c1a33)"><div class="row between wrapf"><div class="row"><span style="font-size:44px">${NATIONS[G.p.nat].f}</span><div><h3 class="teko gold" style="font-size:28px;margin:0;text-transform:none;letter-spacing:.5px">Seleção ${G.p.nat}</h3>
    <div class="sm">${G.p.ovr>=74?'<b class="acc">🟢 Convocável!</b> Seu nível garante vaga na próxima Copa.':`Atinja OVR 74+ (ou 71+ com mídia 65+) para ser convocado. Hoje: OVR ${G.p.ovr}.`}</div></div></div>
    <div style="text-align:right"><div class="xs mut">PRÓXIMA COPA</div><div class="teko" style="font-size:34px">${G.year+((2026-G.year)%4+4)%4}</div><div class="xs mut">${c.wcApps} jogos · ${c.wcGoals} gols em Copas</div></div></div></div>
   <div class="grid g4">${[[c.matches+tm*0,'Jogos',''],[c.goals,'Gols','acc'],[c.assists,'Assistências','blue'],[G.trophies.length,'Troféus','gold'],[c.wcGoals,'Gols em Copas','amb'],[fmtS(c.earnings),'Ganhos na carreira','acc'],[G.history.length?Math.max(...G.history.map(x=>x.g)):0,'Recorde de gols','acc'],[Math.max(...G.ovrHist.map(o=>o.o),G.p.ovr),'OVR máximo','gold']].map(([v,l,cl])=>`<div class="kpi"><b class="${cl}" style="${String(v).length>7?'font-size:22px':''}">${v}</b><span>${l}</span></div>`).join('')}</div>
   <div class="grid g2"><div class="card"><h3><span>Gols e assistências por temporada</span><span class="legend"><span><i style="background:#34d399"></i>Gols</span><span><i style="background:#60a5fa"></i>Assist.</span></span></h3>${barChart(h)}</div>
    <div class="card"><h3>Evolução do OVR</h3>${lineChart(pts)}</div></div>
   <div class="card"><h3>Histórico de temporadas</h3>${h.length?`<div class="tscroll"><table><thead><tr><th>Temp.</th><th>Clube</th><th>Divisão</th><th class="c">Pos</th><th class="c">J</th><th class="c">G</th><th class="c">A</th><th class="c">Nota</th><th class="c">OVR</th></tr></thead><tbody>
    ${h.slice().reverse().map(x=>`<tr><td class="b">${x.y}</td><td><div class="clubcell">${crest(x.club,18)}${CLUB[x.club].name}${x.clubs.length>1?` <span class="xs mut">(+${x.clubs.length-1})</span>`:''}</div></td><td>${divBadge(x.div)}</td><td class="c">${x.pos}º</td><td class="c">${x.j}</td><td class="c acc b">${x.g}</td><td class="c blue b">${x.a}</td><td class="c" style="color:${ratingColor(x.avg)}">${x.avg.toFixed(2)}</td><td class="c">${x.ovr}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma temporada completa ainda.</div>'}</div>
   <div class="card"><h3>Gerenciar carreira</h3><div class="row wrapf"><button class="btn ghost" data-act="export">⬇️ Exportar save</button><button class="btn ghost" data-act="import">⬆️ Importar save</button>
    ${!G.retired&&G.p.age>=33?'<button class="btn gold" data-act="retire">👋 Aposentar-se</button>':''}<button class="btn danger" data-act="reset">🗑️ Apagar carreira</button></div>
    <p class="xs mut" style="margin-top:10px">O progresso é salvo automaticamente no navegador a cada ação. Exporte o save para guardar uma cópia ou levar para outro aparelho.</p></div>
   <div class="card"><h3>🛡️ Escudos dos clubes</h3><div class="row wrapf"><button class="btn ghost" data-act="logos">${logosOn?'🎨 Usar escudos desenhados':'🛡️ Usar escudos reais'}</button>${logosOn?`<button class="btn ghost" data-act="logosreload" ${logoBusy?'disabled':''}>🔄 Baixar novamente</button>`:''}<span class="sm mut">${logosOn?`${Object.keys(LOGO.map).length}/${CLUB_LIST.length} carregados${logoBusy?' (baixando…)':''}`:'Desativado'}</span></div>
    <p class="xs mut" style="margin-top:10px">Fontes gratuitas: Wikipedia/Wikimedia (${Object.values(LOGO.src).filter(x=>x==='Wikipedia').length}) e TheSportsDB (${Object.values(LOGO.src).filter(x=>x==='TheSportsDB').length}). Os clubes sem escudo disponível usam o escudo desenhado. Marcas e escudos pertencem aos respectivos clubes.</p></div></div>`;}

/* ---------- TROPHIES ---------- */
function viewTrophies(){const counts={};G.trophies.forEach(t=>counts[t.t]=(counts[t.t]||0)+1);
  const total=G.trophies.length,unlocked=Object.keys(counts).length,types=Object.keys(TROPHY_TYPES).length;
  return `<div style="display:grid;gap:16px"><div class="trophy-shelf"><div class="row between wrapf" style="margin-bottom:16px"><div><h2 class="teko gold" style="font-size:38px;line-height:1">🏛️ Galeria de Troféus</h2><p class="sm mut">${total} troféus · ${unlocked}/${types} categorias desbloqueadas</p></div>
    <div style="min-width:200px"><div class="xs mut" style="margin-bottom:4px">Conquistas</div><div class="bar"><i style="width:${unlocked/types*100}%;background:linear-gradient(90deg,#f5c542,#d99a0b)"></i></div></div></div>
   <div class="tro-cats">${Object.entries(TROPHY_TYPES).map(([k,t])=>{const n=counts[k]||0;return `<div class="tro-cat ${n?'':'locked'}"><div class="${n?'glow':''}">${trophySVG(t.ic,t.col,64)}</div><div class="n">${n?'×'+n:'🔒'}</div><div class="t">${t.n}</div>${n?'':`<div class="h">${t.h}</div>`}</div>`;}).join('')}</div></div>
   <div class="card"><h3>Linha do tempo de conquistas</h3>${total?`<div class="tro-list">${G.trophies.slice().reverse().map(t=>{const T=TROPHY_TYPES[t.t];return `<div class="tro-item">${trophySVG(T.ic,T.col,44)}<div><b class="sm">${t.l}</b><div class="xs mut row" style="gap:4px;margin-top:3px">${t.y} · ${crest(t.c,12)} ${CLUB[t.c].name}</div></div></div>`;}).join('')}</div>`:'<div class="empty">A estante está vazia — vença a liga, lidere a artilharia ou conquiste um acesso para começar sua coleção.</div>'}</div></div>`;}

/* ============ EVENTS ============ */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='mclose'){closeModal();return;}
  if(a==='tab'){const t=el.dataset.tab;if(M&&M.started&&!M.done&&t!=='match'){toast('⚽ Termine a partida antes de sair do campo.');return;}if(M&&M.done&&t!=='match'){toast('✅ Conclua a rodada primeiro.');return;}sfx.click();tab=t;if(t==='league')ui.lgDiv=null;render();return;}
  const acts={
    sound:()=>{soundOn=!soundOn;try{localStorage.setItem('rat_sound',soundOn?'1':'0');}catch(e){}renderHeader();},
    continue:()=>{G=loadSave();if(G){tab='home';render();toast('▶ Carreira carregada. Auto-save ativo!');}},
    lgjump:()=>{tab='league';ui.lgDiv=null;ui.lgSub=el.dataset.sub;render();},
    lgdiv:()=>{ui.lgDiv=el.dataset.d;render();},lgsub:()=>{ui.lgSub=el.dataset.s;render();},
    mstart:startMatch,bench:benchRound,mconclude:concludeRound,msim:simRest,
    mspeed:()=>{M.speed=+el.dataset.s;setTimer();renderControls();},
    choose:()=>resolve(+el.dataset.i,false),
    train:()=>train(el.dataset.k),rest,
    mkdiv:()=>{ui.mkDiv=el.dataset.d;document.querySelectorAll('[data-act="mkdiv"]').forEach(b=>b.classList.toggle('on',b.dataset.d===ui.mkDiv));renderMarketGrid();},
    nego:()=>negotiate(el.dataset.id),accept:()=>acceptOffer(+el.dataset.i),
    reject:()=>{G.offers.splice(+el.dataset.i,1);save();render();},
    buy:()=>buy(el.dataset.id),
    export:()=>{const b=new Blob([JSON.stringify(G)],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=`rumo-ao-topo-${G.p.name.replace(/\W+/g,'_')}-${G.year}.json`;l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);},
    import:()=>$('#importFile').click(),
    retire:()=>modal('Aposentar-se?','Sua carreira será encerrada e não poderá mais jogar com este atleta.','<button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn gold" data-act="retireok">Confirmar</button>'),
    retireok:()=>{closeModal();retire(false);},
    reset:()=>modal('Apagar carreira?','Todo o progresso salvo será perdido. Isso não pode ser desfeito.','<button class="btn ghost" data-act="mclose">Cancelar</button><button class="btn danger" data-act="resetok">Apagar</button>'),
    resetok:()=>{try{localStorage.removeItem(SAVE_KEY);}catch(e){}G=null;M=null;closeModal();tab='home';render();},
    newcareer:()=>{G=null;M=null;tab='home';render();},
    logos:()=>{logosOn=!logosOn;try{localStorage.setItem('rat_logos_on',logosOn?'1':'0');}catch(e){}if(logosOn)loadLogos();render();},
    logosreload:()=>{loadLogos(true);setTimeout(render,50);}
  };
  if(acts[a])acts[a]();
});
document.addEventListener('submit',e=>{if(e.target.id!=='createForm')return;e.preventDefault();
  const name=$('#cName').value.trim()||'Craque',pos=document.querySelector('input[name="pos"]:checked').value,club=document.querySelector('input[name="club"]:checked').value;
  newCareer(name,pos,$('#cNat').value,club);M=null;tab='home';save();sfx.whistle();render();
  modal('✍️ Contrato assinado!',`<p>Bem-vindo ao <b>${CLUB[club].name}</b>! A Série D ${G.year} vai começar.</p><p>Brilhe para liderar a <b>artilharia</b>, conquistar acessos e atrair propostas de qualquer clube do mercado — da Série D à elite europeia.</p><p class="sm mut">💾 O progresso é salvo automaticamente a cada ação.</p>`);});
document.addEventListener('input',e=>{if(e.target.id==='mkSearch'){ui.mkSearch=e.target.value;renderMarketGrid();}});
document.addEventListener('change',e=>{if(e.target.id==='mkSort'){ui.mkSort=e.target.value;renderMarketGrid();}
  if(e.target.id==='importFile'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||d.v!==2||!d.p)throw 0;G=d;M=null;save();tab='home';render();toast('⬆️ Save importado!');}catch(err){toast('⚠️ Arquivo de save inválido.');}e.target.value='';};r.readAsText(f);}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').classList.contains('show'))closeModal();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G)try{localStorage.setItem(SAVE_KEY,JSON.stringify(G));}catch(e){}});

render();
loadLogos();
</script>
</body>
</html>
